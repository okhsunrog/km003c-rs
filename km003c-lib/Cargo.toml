[package]
name = "km003c-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Protocol parser and async USB library for the ChargerLAB POWER-Z KM003C"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/km003c-lib"
readme = "README.md"
keywords = ["usb", "usb-c", "power-meter", "km003c", "async"]
categories = ["hardware-support", "asynchronous", "api-bindings"]
exclude = ["Cargo.lock", "*.parquet"]

[lib]
name = "km003c_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
modular-bitfield = "0.13.1"
nusb = { version = "0.2.7", features = ["tokio"] }
thiserror = "2.0.19"
tracing.workspace = true
tokio.workspace = true
bytes = "1.12.1"
num_enum = "0.7.6"
zerocopy = { version = "0.8.54", features = ["derive"] }
strum_macros = "0.28.0"
serde = { version = "1.0.229", features = ["derive"], optional = true }
hex = "0.4"
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py38"], optional = true }
aes = "0.9.1"
crc32fast = "1.5.0"
rand = "0.10.2"
uom.workspace = true
usbpd = { workspace = true, optional = true }
futures-util = { version = "0.3.34", default-features = false }
polars = { version = "0.55.2", default-features = false, features = ["csv", "parquet"], optional = true }
serde_json = { version = "1.0.151", optional = true }
parquet = { version = "58", default-features = false, optional = true }
hmac = { version = "0.13.0", optional = true }
sha1 = { version = "0.11.0", optional = true }
base64 = { version = "0.23.1", optional = true }
httpdate = { version = "1.0.3", optional = true }
roxmltree = { version = "0.21.2", optional = true }
sha2 = { version = "0.11.1", optional = true }
cbc = "0.2.1"
percent-encoding = { version = "2.3.2", optional = true }

[features]
default = []
# Browser recording and download backend, without native file threads or Polars.
browser = ["dep:parquet"]
python = ["dep:pyo3"]
serde = ["dep:serde", "uom/serde"]
usbpd = ["dep:usbpd"]
# Live recording, offline export and DataFrame conversion. The polars version
# is part of this feature's API; use the re-exported `km003c_lib::polars`.
polars = ["dep:polars", "dep:tempfile"]
# Front-end preferences saved as JSON.
preferences = ["serde", "dep:serde_json"]
# Official-first release catalog, validated archive fallback and platform HTTP.
firmware-catalog = ["dep:reqwest", "dep:hmac", "dep:sha1", "dep:sha2", "dep:base64", "dep:httpdate", "dep:percent-encoding", "dep:roxmltree", "dep:serde", "dep:serde_json"]

[package.metadata.docs.rs]
features = ["usbpd", "serde", "polars", "preferences", "firmware-catalog"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
tempfile = { version = "3.27.0", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
web-time = "1"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlAnchorElement", "Blob", "Url"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"
