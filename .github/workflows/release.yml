name: Release

# Tag push (v*) builds km003c-egui for every supported desktop platform and
# attaches the archives to a GitHub Release, and publishes the km003c Python
# wheels to PyPI. workflow_dispatch performs the same builds for verification
# without publishing a release; set publish-pypi to also upload the wheels,
# which is how a version whose tag predates this workflow reaches PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish-pypi:
        description: "Upload the built wheels to PyPI"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag against workspace version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "::error::Could not read the workspace version"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match workspace version v${version}"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            platform: macos-universal
            target: universal-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - name: Build release binary
        if: matrix.platform != 'macos-universal'
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release --locked -p km003c-egui --target "${{ matrix.target }}"

      - name: Build universal macOS binary
        if: matrix.platform == 'macos-universal'
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked -p km003c-egui --target x86_64-apple-darwin
          cargo build --release --locked -p km003c-egui --target aarch64-apple-darwin
          mkdir -p "target/${{ matrix.target }}/release"
          lipo -create \
            target/x86_64-apple-darwin/release/km003c-egui \
            target/aarch64-apple-darwin/release/km003c-egui \
            -output "target/${{ matrix.target }}/release/km003c-egui"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="km003c-egui-v${{ needs.validate.outputs.version }}-${{ matrix.platform }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/km003c-egui" "dist/${name}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          chmod +x "dist/${name}/km003c-egui"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "km003c-egui-v${{ needs.validate.outputs.version }}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/km003c-egui.exe" "dist/$name/"
          Copy-Item "README.md", "LICENSE-MIT", "LICENSE-APACHE" "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: km003c-egui-${{ matrix.platform }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  wheels:
    name: Wheel ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64
          - os: ubuntu-latest
            platform: linux-aarch64
            target: aarch64
          - os: macos-latest
            platform: macos-x86_64
            target: x86_64
          - os: macos-latest
            platform: macos-aarch64
            target: aarch64
          - os: windows-latest
            platform: windows-x86_64
            target: x64

    steps:
      - uses: actions/checkout@v7

      # pyo3 is built with abi3-py38, so one wheel per platform covers every
      # CPython from 3.8 up and new interpreter releases need no rebuild.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          sccache: "true"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    # Tags publish automatically. A manual run only publishes when asked, so
    # the same workflow can be used to verify the build without uploading.
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish-pypi
    needs:
      - wheels
      - sdist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing mints a short-lived OIDC token, so no PyPI secret
      # is stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: km003c-egui-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum km003c-egui-* > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
