name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, test, lint, docs, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwayland-dev libxkbcommon-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --all-features --locked
      - name: Test shared GPU renderer and egui texture integration
        env:
          WGPU_BACKEND: vulkan
        run: |
          cargo test -p realtime-plot --locked -- --ignored
          cargo test -p km003c-egui gpu_plot::tests::gpu_cache --locked -- --ignored
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package -p km003c-lib --locked

  msrv:
    name: Rust 1.99.1 compatibility
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-1.99.1
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check --workspace --all-targets --all-features --locked

  slint:
    name: Slint desktop and headless MCP
    runs-on: ubuntu-latest
    env:
      SLINT_EMIT_DEBUG_INFO: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: km003c-slint -> target
          key: slint-rust-1.99.1
      - run: cargo fmt --manifest-path km003c-slint/Cargo.toml --all --check
      - run: cargo test --manifest-path km003c-slint/Cargo.toml --all-targets --features mcp --locked
      - run: cargo clippy --manifest-path km003c-slint/Cargo.toml --all-targets --features mcp --locked -- -D warnings
      - run: cargo build --manifest-path km003c-slint/Cargo.toml --features mcp --locked
      - run: uv run --no-project python km003c-slint/scripts/mcp_smoke.py --binary km003c-slint/target/debug/km003c-slint --output-dir mcp-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: slint-mcp-results
          path: mcp-results
          if-no-files-found: ignore

  platforms:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run maturin develop
      - run: uv run pytest -q test_bindings.py

  browser:
    name: Browser egui (WebUSB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-egui
      - run: cargo check -p km003c-egui --target wasm32-unknown-unknown --locked
      - name: Install the browser test runner matching Cargo.lock
        run: cargo install wasm-bindgen-cli --version "$(cargo pkgid --package wasm-bindgen --locked | sed 's/.*@//')" --locked
      - name: Test browser recording and navigation protection
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          CHROMEDRIVER: /usr/local/share/chromedriver-linux64/chromedriver
        run: cargo test -p km003c-lib --target wasm32-unknown-unknown --features browser --test browser_recording --locked
      - run: cargo install trunk --version 0.21.14 --locked
      - run: trunk build --release
