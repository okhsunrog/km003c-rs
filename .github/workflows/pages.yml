name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an active deployment finish; keep only the latest queued update.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build browser monitor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-egui-pages
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked
      - name: Install wasm-bindgen matching Cargo.lock
        run: cargo install wasm-bindgen-cli --version "$(cargo pkgid --package wasm-bindgen --locked | sed 's/.*@//')" --locked
      - name: Build static site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: trunk build --release --public-url "${PAGES_BASE_PATH}/"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish browser monitor
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
