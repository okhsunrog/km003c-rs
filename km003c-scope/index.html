<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KM003C Scope</title>
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="km003c-scope" data-wasm-opt="0">
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: white; font-family: sans-serif; }
    body { min-height: 960px; }
    canvas { width: 100%; height: 100%; min-height: 960px; display: block; }
    #notice { position: absolute; padding: 1em; }
  </style>
</head>
<body>
  <div id="notice">Loading KM003C scope…</div>
  <canvas id="km003c-scope"></canvas>
  <script>
    document.getElementById('km003c-scope').addEventListener('contextmenu', (event) => event.preventDefault());
    if (!isSecureContext || !navigator.usb) {
      document.getElementById('notice').textContent =
        'WebUSB requires Chrome or Edge on desktop, with HTTPS or localhost. Firefox and Safari do not support WebUSB.';
    }
  </script>
</body>
</html>
