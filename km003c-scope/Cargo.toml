[package]
name = "km003c-scope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Simple time-domain scope for the ChargerLAB POWER-Z KM003C"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "km003c-scope"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
km003c-lib = { workspace = true, features = ["usbpd"] }
egui_plot = "0.37.0"
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.36.2"
rfd = "0.15"
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true
zstd = "0.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
console_error_panic_hook = "0.1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
js-sys = "0.3"
log = "0.4"
nusb = "0.2.7"
tokio.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "console"] }
ruzstd = "0.9.1"

[dev-dependencies]
ruzstd = "0.9.1"
