<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POWER-Z KM003C Monitor</title>
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="km003c-egui" data-wasm-opt="0">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #202020; color: white; font-family: sans-serif; }
    canvas { width: 100%; height: 100%; display: block; }
    #notice { position: absolute; padding: 1em; }
  </style>
</head>
<body>
  <div id="notice">Loading KM003C monitor…</div>
  <canvas id="km003c"></canvas>
  <script>
    if (!isSecureContext || !navigator.usb) {
      document.getElementById('notice').textContent =
        'WebUSB requires Chrome or Edge on desktop, with HTTPS or localhost. Firefox and Safari do not support WebUSB.';
    } else if (!navigator.gpu) {
      document.getElementById('notice').textContent =
        'WebGPU is required. Use desktop Chrome or Edge with WebGPU enabled.';
    }
  </script>
</body>
</html>
