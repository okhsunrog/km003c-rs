[package]
name = "km003c-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Graphical monitor for the ChargerLAB POWER-Z KM003C"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "km003c-egui"
path = "src/main.rs"

[dependencies]
km003c-lib = { workspace = true, features = ["usbpd", "preferences", "firmware-catalog"] }
egui_plot = "0.37.0"
realtime-plot = { path = "../realtime-plot" }
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.36.2"
km003c-lib = { workspace = true, features = ["polars"] }
rfd = "0.17.2"
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true
dirs = "7.0.0"

[dev-dependencies]
hex = "0.4.3"
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3.34", default-features = false }
km003c-lib = { workspace = true, features = ["browser"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu_no_default_features"] }
tokio.workspace = true
nusb = "0.2.7"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Storage"] }
